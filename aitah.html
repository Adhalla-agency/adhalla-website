<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aitäh | Adhalla</title>
  <meta name="description" content="Sinu päring on Adhallani jõudnud.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://adhalla.ee/aitah.html">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#170C22">
  <link rel="stylesheet" href="adhalla-swipe-v36.css?v=production1">
</head>
<body>
<header class="nav shell">
  <a class="brand" href="/">
    <img src="assets/adhalla-logo.png" alt="Adhalla logo">
    <span>ADHALLA</span>
  </a>
</header>

<main class="hero shell">
  <div class="eyebrow">AITÄH</div>
  <h1 id="thanks-title">Sinu päring on meieni jõudnud.</h1>
  <p class="lead" id="thanks-copy">
    Vaatame info üle ja võtame sinuga ühendust.
  </p>
  <div class="hero-actions">
    <a class="button primary" href="/">Tagasi avalehele</a>
  </div>
</main>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const type = params.get("type") || "client";
  const variant = params.get("variant") || "n/a";

  const title = document.getElementById("thanks-title");
  const copy = document.getElementById("thanks-copy");

  const messages = {
    contact: {
      title: "Sinu sõnum on meieni jõudnud.",
      copy: "Vaatame selle üle ja võtame sinuga vajadusel ühendust."
    },
    "future-client": {
      title: "Sinu huvi on kirjas.",
      copy: "Hoiame sind Adhalla arenguga kursis ja võtame ühendust, kui järgmine samm muutub asjakohaseks."
    },
    "future-worker": {
      title: "Sinu huvi on kirjas.",
      copy: "Täname, et tahad Adhalla tulevikus kaasa mõelda. Võtame ühendust, kui sobiv võimalus tekib."
    },
    client: {
      title: "Sinu päring on meieni jõudnud.",
      copy: "Vaatame sinu lähtekoha üle ja võtame sinuga ühendust, kui Adhalla võiks sinu ettevõttele sobida."
    }
  };

  const m = messages[type] || messages.client;
  title.textContent = m.title;
  copy.textContent = m.copy;

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event:"adhalla_lead_success",
    experiment_id:"landing_v1",
    experiment_variant:variant,
    lead_type:type
  });
})();
</script>
</body>
</html>
